<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research — ThoughtBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--bg-2:#0c0e12;--panel:#10131a;--panel-2:#151922;--line:rgba(255,255,255,.075);--line-2:rgba(255,255,255,.14);--text:#e8ebf1;--text-2:#98a1b2;--text-3:#606a7b;--accent:oklch(.78 .1 215);--accent-dim:oklch(.78 .1 215/.16);--link:oklch(.75 .11 300);--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;flex:0 0 auto;background:linear-gradient(180deg,var(--panel-2),var(--panel));border-bottom:1px solid var(--line);position:relative;z-index:3}
.home{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);text-decoration:none}
.home:hover{color:var(--text)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:9px;height:9px;border-radius:2px;background:var(--link);box-shadow:0 0 12px var(--link);flex:0 0 auto}
.brand .proj{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.brand h1{font-size:14.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hgroup{display:flex;flex-direction:column;gap:3px;min-width:0}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:32px;width:220px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search svg{flex:0 0 auto;opacity:.5}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:13px/1 "IBM Plex Sans",sans-serif}
.search input::placeholder{color:var(--text-3)}
.search kbd{font:400 10px/1 var(--mono);color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:3px 4px}
.tools{display:flex;align-items:center;gap:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.tools button{display:grid;place-items:center;min-width:28px;height:26px;padding:0 6px;border-radius:6px;color:var(--text-2);font:500 12px/1 var(--mono)}
.tools button:hover{background:var(--panel-2);color:var(--text)}
.tools .zoom{width:46px;font-size:11px;color:var(--text-3)}
#stat{padding:0 10px;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.055) 1px,transparent 0) 0 0/26px 26px,radial-gradient(120% 90% at 30% 0,#0d1016 0,var(--bg) 70%)}
#stage.dragging{cursor:grabbing}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 30px rgba(0,0,0,.55)}
#canvas{position:absolute;transform-origin:0 0}
.rcard{position:absolute;width:320px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:11px;padding:13px 15px 11px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 24px -16px #000;transition:border-color .16s,opacity .18s;cursor:pointer;touch-action:none;user-select:none}
.rcard:hover{border-color:var(--line-2)}
.rcard.moving{z-index:3;border-color:var(--link);cursor:grabbing}
.rcard.fade{opacity:.22}
.rcard.hit{border-color:var(--link)}
.rcard .t{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.rcard .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font:400 10px/1 var(--mono);color:var(--text-3)}
.rcard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.rcard .tag{padding:2px 7px;border-radius:5px;background:var(--bg-2);border:1px solid var(--line);font:400 10px/1.4 var(--mono);color:var(--text-2)}
.rcard .ex{position:relative;margin-top:8px;font-size:12px;line-height:1.6;color:var(--text-2);max-height:120px;overflow:hidden}
.rcard .ex::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(transparent,var(--panel))}
.rcard .open{margin-top:8px;font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.rz{position:absolute;right:1px;bottom:1px;width:16px;height:16px;cursor:nwse-resize;border-radius:0 0 10px 0;background:linear-gradient(135deg,transparent 52%,var(--line-2) 54%,transparent 58%,transparent 66%,var(--line-2) 68%,transparent 72%)}
.rz:hover{background:linear-gradient(135deg,transparent 52%,var(--accent) 54%,transparent 58%,transparent 66%,var(--accent) 68%,transparent 72%)}
#tip{position:absolute;right:14px;bottom:14px;font:400 10.5px/1.6 var(--mono);color:var(--text-3);text-align:right;pointer-events:none}
#emptyhint{position:absolute;inset:0;display:none;place-items:center;font:500 11px/1.9 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);pointer-events:none;text-align:center}
/* reader overlay */
#reader{position:fixed;inset:0;display:none;background:rgba(0,0,0,.72);z-index:9;backdrop-filter:blur(3px)}
#reader.open{display:grid;place-items:center}
#rpanel{width:min(920px,94vw);height:min(88vh,1100px);display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line-2);border-radius:14px;box-shadow:0 40px 90px -30px #000;overflow:hidden}
#rhead{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
#rhead .rt{font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rhead .rm{font:400 10px/1 var(--mono);color:var(--text-3);white-space:nowrap}
#rhead .x{margin-left:auto;width:30px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--text-2);border:1px solid var(--line)}
#rhead .x:hover{color:var(--text);border-color:var(--line-2)}
#rbody{flex:1;overflow-y:auto;padding:22px 30px 50px;scrollbar-width:thin}
#rbody{font-size:14.5px;line-height:1.7}
#rbody h1,#rbody h2,#rbody h3{letter-spacing:-.015em;line-height:1.3;margin:1.5em 0 .5em}
#rbody h1{font-size:24px;margin-top:.2em}
#rbody h2{font-size:18.5px;border-bottom:1px solid var(--line);padding-bottom:7px}
#rbody h3{font-size:15.5px}
#rbody p{margin:.7em 0;color:#c6cddb}
#rbody ul,#rbody ol{margin:.7em 0 .7em 1.4em;color:#c6cddb}
#rbody li{margin:.25em 0}
#rbody a{color:var(--accent)}
#rbody code{font:.86em var(--mono);background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--text-2)}
#rbody pre{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;overflow-x:auto;margin:1em 0}
#rbody pre code{background:none;border:0;padding:0}
#rbody blockquote{border-left:3px solid var(--link);margin:1em 0;padding:2px 0 2px 15px;color:var(--text-2)}
#rbody table{border-collapse:collapse;margin:1em 0;width:100%}
#rbody th,#rbody td{border:1px solid var(--line);padding:7px 11px;text-align:left;font-size:13px}
#rbody th{font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
#rbody hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
@media (pointer:coarse){.tools button{min-width:36px;height:34px}}
@media (max-width:700px){#tip{display:none}.brand .proj{display:none}.search{width:140px}header{gap:8px;padding:0 10px}#rbody{padding:16px 16px 40px}}
</style>
</head>
<body>
<header>
  <a class="home" href="/">⌂ boards</a>
  <div class="brand"><span class="mark"></span><div class="hgroup"><span class="proj" id="proj"></span><h1>Research</h1></div></div>
  <div class="spacer"></div>
  <label class="search"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6.8" cy="6.8" r="4.4"/><path d="M10.2 10.2 14 14"/></svg><input id="q" type="search" placeholder="Filter docs" autocomplete="off"><kbd>/</kbd></label>
  <div class="tools"><button id="zo" title="Zoom out">−</button><button class="zoom" id="zl" title="Zoom">100%</button><button id="zi" title="Zoom in">+</button><button id="fit" title="Fit (F)">⤢</button><button id="auto" title="Auto-align: masonry by date">⇅</button></div>
  <span id="stat">loading…</span>
</header>
<div id="stage">
  <div id="canvas"></div>
  <div id="emptyhint">no research docs yet<br>the agent adds them via write_research / ingest_research</div>
  <div id="tip">click a card to read · drag to arrange · corner to resize · ⇅ auto-align<br>scroll to zoom · F fit · Esc close</div>
</div>
<div id="reader"><div id="rpanel"><div id="rhead"><span class="rt" id="rt"></span><span class="rm" id="rm"></span><button class="x" id="rx" title="Close">✕</button></div><div id="rbody"></div></div></div>
<script>
const parts = location.pathname.split("/");
const PROJ = parts[2], DOC0 = parts[3] || null;
const API = "/api/projects/" + PROJ + "/research";
const el = id => document.getElementById(id);
const stage = el("stage"), canvas = el("canvas");

let CARDS = [], LAYOUT = { docs: {} }, dom = {}, Hh = {};
let q = "", ver = null, openDoc = null;
let W = 800, Hgt = 600;
let tx = 0, ty = 0, k = 1, drag = false, sx = 0, sy = 0, moved = false;
let nd = null, rz = null, squelch = false;
const cw = c => (LAYOUT.docs[c.doc] && LAYOUT.docs[c.doc].w) || 320;
const ch = c => (LAYOUT.docs[c.doc] && LAYOUT.docs[c.doc].h) || 120;
const inField = () => ["INPUT", "TEXTAREA", "SELECT"].includes((document.activeElement || {}).tagName);
function setStat(t) { el("stat").textContent = t; }

/* ---------------- layout persistence ---------------- */
let saveTimer = 0, saving = false, again = false, unsaved = false;
async function saveLayout() {
  if (saving) { again = true; return; }
  saving = true; setStat("saving layout…");
  try {
    const r = await fetch(API + "/layout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(LAYOUT) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    if (j.version) ver = j.version;
    unsaved = false;
    setStat("layout saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  } catch (e) {
    setStat("layout save failed — retrying");
    clearTimeout(saveTimer); saveTimer = setTimeout(saveLayout, 3000);
  } finally {
    saving = false;
    if (again) { again = false; saveLayout(); }
  }
}
function dirtyLayout() { unsaved = true; setStat("layout…"); clearTimeout(saveTimer); saveTimer = setTimeout(saveLayout, 800); }

/* ---------------- placement ---------------- */
function ensurePositions() {
  // docs without a stored spot flow into a masonry grid after the placed ones
  const missing = CARDS.filter(c => !LAYOUT.docs[c.doc] || !LAYOUT.docs[c.doc].pos);
  if (!missing.length) return;
  const placed = CARDS.filter(c => LAYOUT.docs[c.doc] && LAYOUT.docs[c.doc].pos);
  const startX = placed.length ? Math.max(...placed.map(c => LAYOUT.docs[c.doc].pos.x + cw(c))) + 80 : 60;
  const cols = Math.max(2, Math.min(6, Math.ceil(Math.sqrt(missing.length))));
  const colY = new Array(cols).fill(60), pitch = 360;
  missing.forEach(c => {
    const i = colY.indexOf(Math.min(...colY));
    LAYOUT.docs[c.doc] = LAYOUT.docs[c.doc] || {};
    LAYOUT.docs[c.doc].pos = { x: startX + i * pitch, y: colY[i] };
    colY[i] += (Hh[c.doc] || 240) + 40;
  });
}
function autoAlign() {
  const sorted = CARDS.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || a.title.localeCompare(b.title));
  const cols = Math.max(2, Math.min(6, Math.ceil(Math.sqrt(sorted.length * 1.4))));
  const colY = new Array(cols).fill(60), pitch = 360;
  sorted.forEach(c => {
    const i = colY.indexOf(Math.min(...colY));
    LAYOUT.docs[c.doc] = LAYOUT.docs[c.doc] || {};
    LAYOUT.docs[c.doc].pos = { x: 60 + i * pitch, y: colY[i] };
    colY[i] += (Hh[c.doc] || 240) + 40;
  });
  rebuild(); fit(true); dirtyLayout();
}

/* ---------------- rendering ---------------- */
function extents() {
  if (CARDS.length) {
    W = Math.max(...CARDS.map(c => LAYOUT.docs[c.doc].pos.x + cw(c))) + 140;
    Hgt = Math.max(...CARDS.map(c => LAYOUT.docs[c.doc].pos.y + (Hh[c.doc] || 240))) + 140;
  } else { W = 800; Hgt = 600; }
  canvas.style.width = W + "px"; canvas.style.height = Hgt + "px";
}
function makeCard(c) {
  const lay = LAYOUT.docs[c.doc];
  const d = document.createElement("div");
  d.className = "rcard";
  d.style.left = lay.pos.x + "px"; d.style.top = lay.pos.y + "px";
  d.style.width = cw(c) + "px";
  const t = document.createElement("div"); t.className = "t"; t.textContent = c.title; d.appendChild(t);
  const m = document.createElement("div"); m.className = "meta";
  m.textContent = [c.date, c.words + " words"].filter(Boolean).join(" · ");
  d.appendChild(m);
  if (c.tags.length) {
    const tg = document.createElement("div"); tg.className = "tags";
    c.tags.forEach(x => { const s = document.createElement("span"); s.className = "tag"; s.textContent = x; tg.appendChild(s); });
    d.appendChild(tg);
  }
  if (c.excerpt) {
    const ex = document.createElement("div"); ex.className = "ex"; ex.textContent = c.excerpt;
    ex.style.maxHeight = ch(c) + "px";
    d.appendChild(ex);
  }
  const op = document.createElement("div"); op.className = "open"; op.textContent = "read →"; d.appendChild(op);
  d.addEventListener("pointerdown", e => {
    e.stopPropagation();
    if (e.target.closest(".rz")) return;
    nd = { doc: c.doc, sx: e.clientX, sy: e.clientY, ox: lay.pos.x, oy: lay.pos.y, moved: false };
    try { d.setPointerCapture(e.pointerId); } catch (err) {}
  });
  d.addEventListener("pointermove", e => {
    if (nd && nd.doc === c.doc) {
      if (!nd.moved && Math.hypot(e.clientX - nd.sx, e.clientY - nd.sy) < 4) return;
      nd.moved = true; d.classList.add("moving");
      lay.pos.x = nd.ox + (e.clientX - nd.sx) / k;
      lay.pos.y = nd.oy + (e.clientY - nd.sy) / k;
      d.style.left = lay.pos.x + "px"; d.style.top = lay.pos.y + "px";
      return;
    }
    if (rz && rz.doc === c.doc) {
      const w = Math.min(900, Math.max(240, rz.w0 + (e.clientX - rz.sx) / k));
      const h = Math.min(1200, Math.max(120, rz.h0 + (e.clientY - rz.sy) / k));
      lay.w = Math.round(w); lay.h = Math.round(h);
      d.style.width = lay.w + "px";
      const ex = d.querySelector(".ex"); if (ex) ex.style.maxHeight = lay.h + "px";
    }
  });
  d.addEventListener("pointerup", () => {
    if (nd && nd.doc === c.doc) {
      if (nd.moved) { d.classList.remove("moving"); measure(); extents(); dirtyLayout(); squelch = true; }
      nd = null;
    }
    if (rz && rz.doc === c.doc) { rz = null; measure(); extents(); dirtyLayout(); squelch = true; }
  });
  d.addEventListener("click", e => {
    e.stopPropagation();
    if (squelch) { squelch = false; return; }
    openReader(c.doc);
  });
  const rzh = document.createElement("div"); rzh.className = "rz"; rzh.title = "Drag to resize";
  rzh.addEventListener("pointerdown", e => {
    e.stopPropagation();
    rz = { doc: c.doc, sx: e.clientX, sy: e.clientY, w0: cw(c), h0: ch(c) };
    try { d.setPointerCapture(e.pointerId); } catch (err) {}
  });
  d.appendChild(rzh);
  return d;
}
function measure() { CARDS.forEach(c => { if (dom[c.doc]) Hh[c.doc] = dom[c.doc].offsetHeight; }); }
function paint() {
  CARDS.forEach(c => {
    const d = dom[c.doc];
    if (!d) return;
    const ok = !q || (c.title + " " + c.doc + " " + c.tags.join(" ") + " " + c.excerpt).toLowerCase().includes(q);
    d.classList.toggle("fade", !ok);
    d.classList.toggle("hit", ok && !!q);
  });
}
function rebuild() {
  ensurePositions();
  [...canvas.querySelectorAll(".rcard")].forEach(d => d.remove());
  dom = {};
  CARDS.forEach(c => { const d = makeCard(c); canvas.appendChild(d); dom[c.doc] = d; });
  measure(); extents(); paint();
  el("proj").textContent = PROJ;
  document.title = "Research: " + PROJ + " — ThoughtBoard";
  el("emptyhint").style.display = CARDS.length ? "none" : "grid";
  requestAnimationFrame(() => { measure(); extents(); });
}

/* ---------------- reader ---------------- */
async function openReader(doc, push = true) {
  let j;
  try {
    const r = await fetch(API + "/" + doc + "/html");
    j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
  } catch (e) { setStat("doc load failed"); return; }
  openDoc = doc;
  el("rt").textContent = j.title;
  el("rm").textContent = [j.meta.date, (j.meta.tags || "")].filter(Boolean).join(" · ");
  el("rbody").innerHTML = j.html;
  el("rbody").scrollTop = 0;
  el("reader").classList.add("open");
  if (push) history.pushState({}, "", "/research/" + PROJ + "/" + doc);
}
function closeReader(push = true) {
  openDoc = null;
  el("reader").classList.remove("open");
  if (push) history.pushState({}, "", "/research/" + PROJ);
}
el("rx").addEventListener("click", () => closeReader());
el("reader").addEventListener("click", e => { if (e.target === el("reader")) closeReader(); });
window.addEventListener("popstate", () => {
  const d = location.pathname.split("/")[3];
  if (d) openReader(d, false); else closeReader(false);
});

/* ---------------- live refresh ---------------- */
async function pollVersion() {
  let j;
  try {
    const r = await fetch(API + "/version");
    if (!r.ok) return;
    j = await r.json();
  } catch (e) { return; }
  if (ver === null || j.version === ver) { if (ver === null) ver = j.version; return; }
  if (saving || unsaved) { ver = j.version; return; }
  if (nd || rz || inField()) return;
  ver = j.version;
  try {
    const r2 = await fetch(API);
    if (!r2.ok) return;
    const data = await r2.json();
    CARDS = data.cards; LAYOUT = data.layout && data.layout.docs ? data.layout : { docs: {} };
  } catch (e) { return; }
  rebuild();
  if (openDoc && !CARDS.some(c => c.doc === openDoc)) closeReader();
  setStat("synced " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
}
setInterval(pollVersion, 2500);

/* ---------------- pan + zoom + pinch ---------------- */
function apply(smooth) {
  canvas.style.transition = smooth ? "transform .35s cubic-bezier(.22,.7,.2,1)" : "none";
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
  el("zl").textContent = Math.round(k * 100) + "%";
}
function fit(smooth) {
  const r = stage.getBoundingClientRect();
  k = Math.min(1, Math.min((r.width - 32) / W, (r.height - 32) / Hgt));
  k = Math.max(k, .15);
  tx = (r.width - W * k) / 2; ty = (r.height - Hgt * k) / 2; apply(smooth);
}
function zoom(f, cx, cy) {
  const r = stage.getBoundingClientRect(), mx = (cx ?? r.width / 2), my = (cy ?? r.height / 2);
  const ns = Math.min(2.4, Math.max(.15, k * f));
  tx = mx - (mx - tx) * ns / k; ty = my - (my - ty) * ns / k; k = ns; apply(true);
}
const touches = new Map();
let pinch = null;
stage.addEventListener("pointerdown", e => {
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: k, tx0: tx, ty0: ty };
    drag = false; stage.classList.remove("dragging");
    return;
  }
  drag = true; moved = false; sx = e.clientX - tx; sy = e.clientY - ty; stage.classList.add("dragging");
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});
stage.addEventListener("pointermove", e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size === 2) {
    const [a, b] = [...touches.values()];
    const r = stage.getBoundingClientRect();
    const mid = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
    const ns = Math.min(2.4, Math.max(.15, pinch.k0 * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / pinch.d0));
    const cx = (mid.x - pinch.tx0) / pinch.k0, cy = (mid.y - pinch.ty0) / pinch.k0;
    k = ns; tx = mid.x - cx * ns; ty = mid.y - cy * ns; apply(false);
    moved = true;
    return;
  }
  if (!drag) return; moved = true; tx = e.clientX - sx; ty = e.clientY - sy; apply(false);
});
const dropTouch = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; };
stage.addEventListener("pointercancel", e => { dropTouch(e); drag = false; stage.classList.remove("dragging"); });
stage.addEventListener("pointerup", e => { dropTouch(e); drag = false; stage.classList.remove("dragging"); });
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.1 : .9, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
el("zi").onclick = () => zoom(1.18); el("zo").onclick = () => zoom(.85);
el("zl").onclick = () => fit(true);
el("fit").onclick = () => fit(true);
el("auto").onclick = autoAlign;
el("q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); paint(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !inField() && !openDoc) { e.preventDefault(); el("q").focus(); }
  else if (e.key === "Escape") {
    if (openDoc) { closeReader(); return; }
    if (inField()) { document.activeElement.blur(); return; }
    el("q").value = ""; q = ""; paint();
  }
  else if ((e.key === "f" || e.key === "F") && !inField() && !openDoc) fit(true);
});
window.addEventListener("resize", () => fit(false));

/* ---------------- boot ---------------- */
(async () => {
  try {
    const r = await fetch(API);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    CARDS = j.cards; LAYOUT = j.layout && j.layout.docs ? j.layout : { docs: {} };
  } catch (e) { setStat("load failed"); return; }
  rebuild(); fit(false);
  setStat(CARDS.length + " docs");
  if (DOC0) openReader(DOC0, false);
})();
</script>
