<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — ThoughtBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--bg-2:#0c0e12;--panel:#10131a;--panel-2:#151922;--line:rgba(255,255,255,.075);--text:#e8ebf1;--text-2:#98a1b2;--text-3:#606a7b;--accent:oklch(.78 .1 215);--link:oklch(.75 .11 300);--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.7 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:10px;padding:0 22px;height:56px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border-bottom:1px solid var(--line)}
.mark{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
header a{color:var(--text-3);text-decoration:none;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
header a:hover{color:var(--text)}
header .proj{font:500 11px/1 var(--mono);color:var(--text-3);margin-left:auto;letter-spacing:.1em;text-transform:uppercase}
article{max-width:820px;margin:0 auto;padding:36px 24px 90px}
article h1,article h2,article h3{letter-spacing:-.015em;line-height:1.3;margin:1.6em 0 .5em}
article h1{font-size:26px;margin-top:0}
article h2{font-size:19px;border-bottom:1px solid var(--line);padding-bottom:8px}
article h3{font-size:15.5px}
article p{margin:.7em 0;color:#c6cddb}
article ul,article ol{margin:.7em 0 .7em 1.4em;color:#c6cddb}
article li{margin:.25em 0}
article a{color:var(--accent)}
article code{font:.86em var(--mono);background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--text-2)}
article pre{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:1em 0}
article pre code{background:none;border:0;padding:0}
article blockquote{border-left:3px solid var(--link);margin:1em 0;padding:2px 0 2px 16px;color:var(--text-2)}
article table{border-collapse:collapse;margin:1em 0;width:100%}
article th,article td{border:1px solid var(--line);padding:7px 11px;text-align:left;font-size:13.5px}
article th{font:500 10.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
article hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
</style>
</head>
<body>
<header><span class="mark"></span><a href="/">⌂ boards</a><span class="proj">__PROJECT__</span></header>
<article>__BODY__</article>
</body>
</html>
