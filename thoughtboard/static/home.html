<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThoughtBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--bg-2:#0c0e12;--panel:#10131a;--panel-2:#151922;--line:rgba(255,255,255,.075);--line-2:rgba(255,255,255,.14);--text:#e8ebf1;--text-2:#98a1b2;--text-3:#606a7b;--accent:oklch(.78 .1 215);--accent-dim:oklch(.78 .1 215/.16);--link:oklch(.75 .11 300);--s-idea:oklch(.7 .03 250);--s-in-progress:oklch(.79 .11 75);--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0) 0 0/26px 26px,radial-gradient(120% 90% at 30% 0,#0d1016 0,var(--bg) 70%);color:var(--text);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--text);text-decoration:none}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:0 22px;height:56px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border-bottom:1px solid var(--line)}
.mark{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
header h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
header .sub{font:400 11px/1 var(--mono);color:var(--text-3);margin-left:8px}
main{max-width:1060px;margin:0 auto;padding:30px 22px 70px}
.eyebrow{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.proj{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 20px -14px #000}
.proj h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.proj .slug{font:400 10.5px/1 var(--mono);color:var(--text-3);margin-top:3px}
.sec{margin-top:14px;font:500 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:2px}
li a,.rowbtn{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;transition:background .14s;width:100%;text-align:left;background:none;border:0;cursor:pointer}
li a:hover,.rowbtn:hover{background:var(--panel-2)}
li i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
li i.r{background:var(--link)}
li .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
li .meta{margin-left:auto;font:400 10px/1 var(--mono);color:var(--text-3);white-space:nowrap}
.empty{color:var(--text-3);font-size:12px;padding:6px 9px}
.newrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
@media (max-width:640px){main{padding:20px 14px 50px}.grid{grid-template-columns:1fr}}
@media (pointer:coarse){li a,.rowbtn{padding:10px 9px}.btn{padding:10px 14px}}
input{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:7px 10px;font-size:12.5px;outline:0;min-width:0}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--text-3)}
.btn{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--text)}
.newproj{margin-top:34px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:560px}
#err{margin-top:14px;color:oklch(.72 .12 25);font:400 11.5px/1.5 var(--mono);white-space:pre-wrap;display:none}
</style>
</head>
<body>
<header><span class="mark"></span><h1>ThoughtBoard</h1><span class="sub" id="stat"></span></header>
<main>
  <div class="eyebrow">Projects</div>
  <div class="grid" id="grid"></div>
  <div class="newproj">
    <div class="eyebrow">New project</div>
    <div class="newrow">
      <input id="np-slug" placeholder="slug (kebab-case)" style="width:180px">
      <input id="np-title" placeholder="Title" style="flex:1">
      <button class="btn" id="np-go">Create</button>
    </div>
  </div>
  <div id="err"></div>
</main>
<script>
const err = m => { const e = document.getElementById('err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; };
async function api(path, opts) {
  const r = await fetch(path, opts ? Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts) : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.detail || r.statusText);
  return j;
}
function el(tag, cls, text) { const d = document.createElement(tag); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; }
async function load() {
  err('');
  const grid = document.getElementById('grid'); grid.textContent = '';
  let projects = [];
  try { projects = await api('/api/projects'); } catch (e) { err(String(e.message || e)); return; }
  document.getElementById('stat').textContent = projects.length + ' project' + (projects.length === 1 ? '' : 's');
  if (!projects.length) grid.appendChild(el('div', 'empty', 'No projects yet — create one below.'));
  projects.forEach(p => {
    const card = el('div', 'proj');
    card.appendChild(el('h2', null, p.title));
    card.appendChild(el('div', 'slug', p.slug));
    card.appendChild(el('div', 'sec', 'Maps'));
    const ml = el('ul');
    if (!p.maps.length) ml.appendChild(el('div', 'empty', 'no maps yet'));
    p.maps.forEach(m => {
      const li = el('li'), a = el('a');
      a.href = '/board/' + p.slug + '/' + m.id;
      a.appendChild(el('i'));
      a.appendChild(el('span', 'nm', m.title));
      a.appendChild(el('span', 'meta', m.nodes + ' nodes · ' + (m.updated || '')));
      li.appendChild(a); ml.appendChild(li);
    });
    card.appendChild(ml);
    const tls = p.timelines || [];
    if (tls.length) {
      card.appendChild(el('div', 'sec', 'Timelines'));
      const tl = el('ul');
      tls.forEach(t => {
        const li = el('li'), a = el('a');
        a.href = '/timeline/' + p.slug + '/' + t.id;
        const i = el('i'); i.className = 'r';
        a.appendChild(i);
        a.appendChild(el('span', 'nm', t.title));
        a.appendChild(el('span', 'meta', t.entries + ' entries · ' + (t.updated || '')));
        li.appendChild(a); tl.appendChild(li);
      });
      card.appendChild(tl);
    }
    const cms = p.codemaps || [];
    if (cms.length) {
      card.appendChild(el('div', 'sec', 'Code maps'));
      const cl = el('ul');
      cms.forEach(c => {
        const li = el('li'), a = el('a');
        a.href = '/code/' + p.slug + '/' + c.id;
        a.appendChild(el('i'));
        a.querySelector('i').style.background = 'oklch(.78 .11 155)';
        a.appendChild(el('span', 'nm', c.title));
        a.appendChild(el('span', 'meta', c.blocks + ' blocks · ' + (c.updated || '')));
        li.appendChild(a); cl.appendChild(li);
      });
      card.appendChild(cl);
    }
    if (p.research.length) {
      card.appendChild(el('div', 'sec', 'Research'));
      const rl = el('ul');
      const boardLi = el('li'), boardA = el('a');
      boardA.href = '/research/' + p.slug;
      const bi = el('i'); bi.className = 'r';
      boardA.appendChild(bi);
      boardA.appendChild(el('span', 'nm', 'Research board'));
      boardA.appendChild(el('span', 'meta', p.research.length + ' docs'));
      boardLi.appendChild(boardA); rl.appendChild(boardLi);
      p.research.slice(0, 4).forEach(r => {
        const li = el('li'), a = el('a');
        a.href = '/research/' + p.slug + '/' + r.doc;
        const i = el('i'); i.className = 'r'; i.style.opacity = '.35';
        a.appendChild(i); a.appendChild(el('span', 'nm', r.title));
        li.appendChild(a); rl.appendChild(li);
      });
      if (p.research.length > 4) rl.appendChild(el('div', 'empty', '+ ' + (p.research.length - 4) + ' more on the board'));
      card.appendChild(rl);
    }
    const row = el('div', 'newrow');
    const mid = el('input'); mid.placeholder = 'slug'; mid.style.width = '110px';
    const mti = el('input'); mti.placeholder = 'Title'; mti.style.flex = '1';
    const go = el('button', 'btn', '＋ Map');
    go.addEventListener('click', async () => {
      try {
        await api('/api/projects/' + p.slug + '/maps',
          { method: 'POST', body: JSON.stringify({ id: mid.value.trim(), title: mti.value.trim() }) });
        load();
      } catch (e) { err(String(e.message || e)); }
    });
    const goT = el('button', 'btn', '＋ Timeline');
    goT.addEventListener('click', async () => {
      try {
        await api('/api/projects/' + p.slug + '/timelines',
          { method: 'POST', body: JSON.stringify({ id: mid.value.trim(), title: mti.value.trim() }) });
        load();
      } catch (e) { err(String(e.message || e)); }
    });
    row.append(mid, mti, go, goT); card.appendChild(row);
    grid.appendChild(card);
  });
}
document.getElementById('np-go').addEventListener('click', async () => {
  try {
    await api('/api/projects', { method: 'POST', body: JSON.stringify({
      slug: document.getElementById('np-slug').value.trim(),
      title: document.getElementById('np-title').value.trim() }) });
    document.getElementById('np-slug').value = ''; document.getElementById('np-title').value = '';
    load();
  } catch (e) { err(String(e.message || e)); }
});
load();
</script>
</body>
</html>
